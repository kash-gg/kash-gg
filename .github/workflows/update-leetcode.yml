name: Update LeetCode Stats

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:      # allow manual runs

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch LeetCode stats and build new block
        env:
          LC_USER: "Kashyup_Gaud"
        run: |-
          set -euo pipefail
          echo "Fetching LeetCode stats for $LC_USER..."
          stats=$(curl -sS "https://leetcode-stats-api.herokuapp.com/$LC_USER" || true)
          echo "API response:"
          echo "$stats"

          EASY=$(echo "$stats" | jq -r '.easySolved // empty')
          TOTAL_EASY=$(echo "$stats" | jq -r '.totalEasy // empty')
          MEDIUM=$(echo "$stats" | jq -r '.mediumSolved // empty')
          TOTAL_MEDIUM=$(echo "$stats" | jq -r '.totalMedium // empty')
          HARD=$(echo "$stats" | jq -r '.hardSolved // empty')
          TOTAL_HARD=$(echo "$stats" | jq -r '.totalHard // empty')
          TOTAL=$(echo "$stats" | jq -r '.totalSolved // empty')

          printf '| Difficulty | Solved |\n|-----------|----------|\n| 🟩 **Easy** | %s/%s |\n| 🟧 **Medium** | %s/%s |\n| 🟥 **Hard** | %s/%s |\n| ⭐ **Total** | %s Solved |\n> %s problems solved' "$EASY" "$TOTAL_EASY" "$MEDIUM" "$TOTAL_MEDIUM" "$HARD" "$TOTAL_HARD" "$TOTAL" "$TOTAL" > new_stats.md

      - name: Replace README block between markers
        run: |
          python3 - <<'PY'
from pathlib import Path
p = Path("README.md")
text = p.read_text(encoding="utf-8")
start = "<!-- leetcode-stats-start -->"
end = "<!-- leetcode-stats-end -->"
new_block = Path("new_stats.md").read_text(encoding="utf-8").strip()
if start in text and end in text:
    before, rest = text.split(start, 1)
    _, after = rest.split(end, 1)
    updated = before + start + "\n\n" + new_block + "\n\n" + end + after
    if updated != text:
        p.write_text(updated, encoding="utf-8")
        print("README updated")
    else:
        print("No change to README")
else:
    print("Markers not found in README.md")
    raise SystemExit(1)
PY

      - name: Commit & push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update LeetCode stats" || true
            git push
          fi
