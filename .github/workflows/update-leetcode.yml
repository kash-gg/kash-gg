name: Update LeetCode Stats

on:
  schedule:
    # Runs at 00:00 UTC daily
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  # Explicitly grant write access to the contents (files) of the repository
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: 🛒 Checkout repository
        # Use v4 for better security/updates
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # jq is often pre-installed on GitHub runners, but this is a safe fallback
      - name: 📦 Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: 📊 Fetch LeetCode stats and build new block
        env:
          LC_USER: "Kashyup_Gaud"
          # GITHUB_TOKEN is automatically available
        run: |
          set -euo pipefail
          echo "Fetching LeetCode stats for $LC_USER..."
          
          # Fetch stats, ensure API response is successful before proceeding
          # The -f flag prevents curl from outputting on HTTP error codes (4xx/5xx)
          stats=$(curl -sS -f "https://leetcode-api.vercel.app/$LC_USERR") || {
            echo "::warning::Failed to fetch LeetCode stats for $LC_USER. Skipping update."
            # Set a special exit code to skip subsequent commit steps gracefully
            exit 78
          }
          echo "API response: $stats"
          
          # Use one jq run to get all values, handle missing keys with default 0
          # This is more robust and efficient.
          read EASY TOTAL_EASY MEDIUM TOTAL_MEDIUM HARD TOTAL_HARD TOTAL <<< $(
            echo "$stats" | jq -r '
              .easySolved // 0, .totalEasy // 0,
              .mediumSolved // 0, .totalMedium // 0,
              .hardSolved // 0, .totalHard // 0,
              .totalSolved // 0
            '
          )
          
          echo "Stats fetched: E:$EASY/$TOTAL_EASY | M:$MEDIUM/$TOTAL_MEDIUM | H:$HARD/$TOTAL_HARD"

          # Use unquoted EOF (<<EOF) to enable shell variable expansion
          cat > new_stats.md <<EOF
| Difficulty | Solved |
|-----------|--------|
| 🟩 **Easy** | ${EASY}/${TOTAL_EASY} |
| 🟧 **Medium** | ${MEDIUM}/${TOTAL_MEDIUM} |
| 🟥 **Hard** | ${HARD}/${TOTAL_HARD} |
| ⭐ **Total** | ${TOTAL} Solved |

> ${TOTAL} problems solved
EOF
          
      - name: 📝 Safely update README between markers (create if missing)
        # No change needed here, your Python script is robust.
        run: |
          python3 - <<'PY'
from pathlib import Path
p = Path("README.md")
if not p.exists():
    p.write_text("# README\n\n\n\n", encoding="utf-8")

text = p.read_text(encoding="utf-8")
start = ""
end = ""
# The .read_text() method in the original code had .strip() which is good.
new_block = Path("new_stats.md").read_text(encoding="utf-8").strip()

if start in text and end in text:
    before, rest = text.split(start, 1)
    _, after = rest.split(end, 1)
    # Ensure a consistent newline pattern
    updated = before + start + "\n\n" + new_block + "\n\n" + end + after
    action = "replaced"
else:
    # Append the block if markers are missing
    updated = text.rstrip() + "\n\n" + start + "\n\n" + new_block + "\n\n" + end + "\n"
    action = "appended"

if updated != text:
    p.write_text(updated, encoding="utf-8")
    print(f"README updated ({action}).")
else:
    print("No change to README.")
PY

      - name: ⬆️ Commit & push changes
        # Use a single, clean step for committing and pushing.
        # This simplifies the complex conditional push logic from the original.
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # Uses GITHUB_TOKEN automatically, granted write access by permissions: write
          author: "GitHub Actions <action@github.com>"
          message: "🤖 Update LeetCode stats"
          # Only commit README.md
          files: README.md
          # Only push if there are changes
          commit_if_changed: true
