name: Update LeetCode Stats
on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:    # Allows manual trigger

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch and Update LeetCode stats
        run: |
          # Fetch stats from LeetCode API
          stats=$(curl -s "https://leetcode-stats-api.herokuapp.com/Kashyup_Gaud")
          
          # Extract values using jq
          EASY=$(echo $stats | jq -r '.easySolved')
          TOTAL_EASY=$(echo $stats | jq -r '.totalEasy')
          MEDIUM=$(echo $stats | jq -r '.mediumSolved')
          TOTAL_MEDIUM=$(echo $stats | jq -r '.totalMedium')
          HARD=$(echo $stats | jq -r '.hardSolved')
          TOTAL_HARD=$(echo $stats | jq -r '.totalHard')
          TOTAL=$(echo $stats | jq -r '.totalSolved')
          
          # Update README using sed
          sed -i "s/| \*\*Easy\*\* |.*|/| **Easy** | $EASY\/$TOTAL_EASY |/g" README.md
          sed -i "s/| \*\*Medium\*\* |.*|/| **Medium** | $MEDIUM\/$TOTAL_MEDIUM |/g" README.md
          sed -i "s/| \*\*Hard\*\* |.*|/| **Hard** | $HARD\/$TOTAL_HARD |/g" README.md
          sed -i "s/| \*\*Total\*\* |.*Solved |/| **Total** | $TOTAL Solved |/g" README.md
          sed -i "s/> .* problems solved/> $TOTAL problems solved/g" README.md

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update LeetCode stats" && git push)
