name: Update LeetCode Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch LeetCode stats and build new block
        env:
          LC_USER: "Kashyup_Gaud"
        run: |
          set -euo pipefail
          echo "Fetching LeetCode stats for $LC_USER..."
          stats=$(curl -sS "https://leetcode-stats-api.herokuapp.com/$LC_USER" || true)
          echo "API response:"
          echo "$stats"

          EASY=$(echo "$stats" | jq -r '.easySolved // empty')
          TOTAL_EASY=$(echo "$stats" | jq -r '.totalEasy // empty')
          MEDIUM=$(echo "$stats" | jq -r '.mediumSolved // empty')
          TOTAL_MEDIUM=$(echo "$stats" | jq -r '.totalMedium // empty')
          HARD=$(echo "$stats" | jq -r '.hardSolved // empty')
          TOTAL_HARD=$(echo "$stats" | jq -r '.totalHard // empty')
          TOTAL=$(echo "$stats" | jq -r '.totalSolved // empty')

          EASY=${EASY:-0}
          TOTAL_EASY=${TOTAL_EASY:-0}
          MEDIUM=${MEDIUM:-0}
          TOTAL_MEDIUM=${TOTAL_MEDIUM:-0}
          HARD=${HARD:-0}
          TOTAL_HARD=${TOTAL_HARD:-0}
          TOTAL=${TOTAL:-0}

          cat > new_stats.md <<'EOF'
| Difficulty | Solved |
|-----------|--------|
| 🟩 **Easy** | '${EASY}/${TOTAL_EASY}' |
| 🟧 **Medium** | '${MEDIUM}/${TOTAL_MEDIUM}' |
| 🟥 **Hard** | '${HARD}/${TOTAL_HARD}' |
| ⭐ **Total** | '${TOTAL} Solved' |

> '${TOTAL} problems solved'
EOF

      - name: Safely update README between markers (create if missing)
        run: |
          python3 - <<'PY'
from pathlib import Path
p = Path("README.md")
if not p.exists():
    p.write_text("# README\n\n<!-- leetcode-stats-start -->\n<!-- leetcode-stats-end -->\n", encoding="utf-8")

text = p.read_text(encoding="utf-8")
start = "<!-- leetcode-stats-start -->"
end = "<!-- leetcode-stats-end -->"
new_block = Path("new_stats.md").read_text(encoding="utf-8").strip()

if start in text and end in text:
    before, rest = text.split(start, 1)
    _, after = rest.split(end, 1)
    updated = before + start + "\n\n" + new_block + "\n\n" + end + after
    action = "replaced"
else:
    updated = text.rstrip() + "\n\n" + start + "\n\n" + new_block + "\n\n" + end + "\n"
    action = "appended"

if updated != text:
    p.write_text(updated, encoding="utf-8")
    print(f"README updated ({action}).")
else:
    print("No change to README.")
PY

      - name: Commit & push (try default push; fall back to PAT if needed)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update LeetCode stats" || true

          # extract branch name from GITHUB_REF (refs/heads/<branch>)
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Branch detected: $BRANCH"

          if git push origin "HEAD:$BRANCH"; then
            echo "Pushed successfully with default auth"
          else
            echo "Default push failed — attempting push using PAT"
            # requires you to add a secret named PAT with a token that has repo scope
            if [ -z "${PAT:-}" ]; then
              echo "PAT secret is not available; cannot push."
              exit 1
            fi
            git remote set-url origin "https://x-access-token:${PAT}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:$BRANCH"
          fi
        env:
          # PAT must be stored as repo secret named PAT if you want fallback
          PAT: ${{ secrets.PAT }}
