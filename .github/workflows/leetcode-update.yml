name: Update LeetCode Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch LeetCode stats
        run: |
          stats=$(curl -s "https://leetcode-stats-api.herokuapp.com/Kashyup_Gaud")
          echo "Stats received:"
          echo "$stats"

          EASY=$(echo "$stats" | jq -r '.easySolved')
          TOTAL_EASY=$(echo "$stats" | jq -r '.totalEasy')
          MEDIUM=$(echo "$stats" | jq -r '.mediumSolved')
          TOTAL_MEDIUM=$(echo "$stats" | jq -r '.totalMedium')
          HARD=$(echo "$stats" | jq -r '.hardSolved')
          TOTAL_HARD=$(echo "$stats" | jq -r '.totalHard')
          TOTAL=$(echo "$stats" | jq -r '.totalSolved')

          cat > stats.md <<EOF
| Difficulty | Solved |
|-----------|--------|
| 🟩 **Easy** | $EASY/$TOTAL_EASY |
| 🟧 **Medium** | $MEDIUM/$TOTAL_MEDIUM |
| 🟥 **Hard** | $HARD/$TOTAL_HARD |
| ⭐ **Total** | $TOTAL Solved |

> $TOTAL problems solved
EOF

      - name: Update README
        run: |
          python3 - << 'EOF'
import pathlib

readme_path = pathlib.Path("README.md")
content = readme_path.read_text()

start = "<!-- leetcode-stats-start -->"
end = "<!-- leetcode-stats-end -->"

with open("stats.md") as f:
    new_stats = f.read().strip()

before = content.split(start)[0]
after = content.split(end)[1]

updated = before + start + "\n\n" + new_stats + "\n\n" + end + after
readme_path.write_text(updated)
EOF

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --cached --quiet || git commit -m "Update stats"
          git push
