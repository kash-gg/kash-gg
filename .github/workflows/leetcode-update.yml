name: Update LeetCode Stats

# run daily and allow manual runs
on:
  schedule:
    - cron: '0 0 * * *'  # daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install jq (for JSON parsing)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Fetch LeetCode stats and prepare README update
        env:
          LC_USER: "Kashyup_Gaud"
        run: |
          set -euo pipefail
          echo "Fetching LeetCode stats for $LC_USER ..."
          stats=$(curl -sS "https://leetcode-stats-api.herokuapp.com/$LC_USER" || true)
          echo "API response:"
          echo "$stats"
          
          if [ -z "$stats" ] || [ "$stats" = "null" ]; then
            echo "No stats returned — aborting update."
            exit 0
          fi

          # attempt to parse keys; fail early if unavailable
          EASY=$(echo "$stats" | jq -r '.easySolved // empty')
          TOTAL_EASY=$(echo "$stats" | jq -r '.totalEasy // empty')
          MEDIUM=$(echo "$stats" | jq -r '.mediumSolved // empty')
          TOTAL_MEDIUM=$(echo "$stats" | jq -r '.totalMedium // empty')
          HARD=$(echo "$stats" | jq -r '.hardSolved // empty')
          TOTAL_HARD=$(echo "$stats" | jq -r '.totalHard // empty')
          TOTAL=$(echo "$stats" | jq -r '.totalSolved // empty')
          
          echo "Parsed: EASY=$EASY MEDIUM=$MEDIUM HARD=$HARD TOTAL=$TOTAL"
          
          # create a stable markdown block that we will insert between markers
          cat > new_stats.md <<EOF
| **Easy** | $EASY/$TOTAL_EASY |
| **Medium** | $MEDIUM/$TOTAL_MEDIUM |
| **Hard** | $HARD/$TOTAL_HARD |
| **Total** | $TOTAL Solved |
> $TOTAL problems solved
EOF

          # Ensure the README has the marker lines. If not, print a hint and fail safely.
          if ! grep -q "<!-- leetcode-stats-start -->" README.md || ! grep -q "<!-- leetcode-stats-end -->" README.md; then
            echo "README.md is missing the marker comments. Please add these around the section you want updated:"
            echo "<!-- leetcode-stats-start -->"
            echo "<!-- leetcode-stats-end -->"
            exit 1
          fi

          # Use python to replace the block between markers with the new content (preserves newline handling)
          python3 - <<PY
import os
from pathlib import Path
rfile = Path("README.md")
old = rfile.read_text(encoding="utf-8")
start = "<!-- leetcode-stats-start -->"
end = "<!-- leetcode-stats-end -->"
newblock = open("new_stats.md", "r", encoding="utf-8").read().strip()
if start in old and end in old:
    prefix, rest = old.split(start,1)
    _, suffix = rest.split(end,1)
    replaced = prefix + start + "\n\n" + newblock + "\n\n" + end + suffix
    if replaced == old:
        print("No changes to README.md")
    else:
        rfile.write_text(replaced, encoding="utf-8")
        print("README.md updated")
else:
    print("Markers not found in README.md; please add them.")
    raise SystemExit(1)
PY

      - name: Commit & push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update LeetCode stats"
            git push
          fi
