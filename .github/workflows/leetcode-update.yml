name: Update LeetCode Stats
on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:    # Allows manual trigger

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch and Update LeetCode stats
        run: |
          # Fetch stats from LeetCode API
          stats=$(curl -s "https://leetcode-stats-api.herokuapp.com/Kashyup_Gaud")
          
          # Extract values using jq
          EASY=$(echo $stats | jq -r '.easySolved')
          TOTAL_EASY=$(echo $stats | jq -r '.totalEasy')
          MEDIUM=$(echo $stats | jq -r '.mediumSolved')
          TOTAL_MEDIUM=$(echo $stats | jq -r '.totalMedium')
          HARD=$(echo $stats | jq -r '.hardSolved')
          TOTAL_HARD=$(echo $stats | jq -r '.totalHard')
          TOTAL=$(echo $stats | jq -r '.totalSolved')
          
          # Create Python script to update README
          cat > update_readme.py << 'PYTHON_EOF'
import re
import sys

with open('README.md', 'r', encoding='utf-8') as f:
    content = f.read()

# Replace the stats in the table
patterns = [
    (r'\| \*\*Easy\*\*\s*\|\s*\d+/\d+\s*\|', f'| **Easy** | {sys.argv[1]}/{sys.argv[2]} |'),
    (r'\| \*\*Medium\*\*\s*\|\s*\d+/\d+\s*\|', f'| **Medium** | {sys.argv[3]}/{sys.argv[4]} |'),
    (r'\| \*\*Hard\*\*\s*\|\s*\d+/\d+\s*\|', f'| **Hard** | {sys.argv[5]}/{sys.argv[6]} |'),
    (r'\| \*\*Total\*\*\s*\|\s*\d+ Solved\s*\|', f'| **Total** | {sys.argv[7]} Solved |'),
    (r'> \d+ problems solved', f'> {sys.argv[7]} problems solved'),
]

for pattern, replacement in patterns:
    content = re.sub(pattern, replacement, content)

with open('README.md', 'w', encoding='utf-8') as f:
    f.write(content)
PYTHON_EOF
          
          # Run Python script with the fetched values
          python3 update_readme.py "$EASY" "$TOTAL_EASY" "$MEDIUM" "$TOTAL_MEDIUM" "$HARD" "$TOTAL_HARD" "$TOTAL"

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update LeetCode stats" && git push)
